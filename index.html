<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Blood Drive Live Tracker</title>
<style>
  :root{
    --navy:#0c2c80;
    --sky:#a7d4f2;
    --yellow:#ffee7d;
    --cream:#fdf9f3;
    --ink:#1b1f23;
    --blood:#b3121c;
    --blood-dark:#7d0d13;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    height:100%;
    overflow:hidden;
    background:var(--cream);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    height:100vh;
    height:100dvh;
    padding:env(safe-area-inset-top,0) 5vw env(safe-area-inset-bottom,0) 5vw;
    text-align:center;
  }
  .top{
    flex:0 0 auto;
    padding-top:clamp(8px, 2.5vh, 20px);
    position:relative;
    z-index:2;
  }
  .mascot-top{
    height:clamp(26px,4.5vh,38px);
    width:auto;
    display:block;
  }
  h1{
    font-size:clamp(20px, 5.5vw, 34px);
    color:var(--navy);
    letter-spacing:0.02em;
    margin-top:6px;
  }
  .subtitle{
    font-size:clamp(12px, 2.6vw, 16px);
    color:var(--ink);
    opacity:0.7;
    margin-top:4px;
    text-transform:uppercase;
    letter-spacing:0.12em;
  }
  .middle{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    width:100%;
    max-width:640px;
    gap:clamp(6px,1.6vh,14px);
    position:relative;
    z-index:2;
  }
  .side-mascot{
    position:fixed;
    top:60%;
    right:0;
    transform:translate(38%,-50%);
    height:clamp(90px,30vh,220px);
    width:auto;
    opacity:0.9;
    pointer-events:none;
    z-index:1;
  }
  .logo-block{
    position:fixed;
    top:calc(env(safe-area-inset-top,0px) + 10px);
    left:calc(env(safe-area-inset-left,0px) + 10px);
    z-index:2;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .logo{
    height:clamp(60px,16vw,100px);
    width:auto;
    opacity:0.95;
  }
  .logo-word{
    font-size:clamp(9px,2.2vw,12px);
    font-weight:800;
    color:var(--navy);
    line-height:1.25;
    letter-spacing:0.08em;
    text-align:left;
  }
  .mascot-ring{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:clamp(48px,10vh,68px);
    height:clamp(48px,10vh,68px);
    border-radius:50%;
    border:3px solid var(--navy);
    background:var(--sky);
    margin:0 auto;
  }
  .count-row{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:clamp(4px,1.5vw,10px);
  }
  .count{
    font-size:clamp(44px, 15vw, 92px);
    font-weight:800;
    color:var(--blood);
    line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .of{
    font-size:clamp(16px,4vw,26px);
    font-weight:600;
    color:var(--navy);
    opacity:0.6;
  }
  .target{
    font-size:clamp(22px,5.5vw,36px);
    font-weight:700;
    color:var(--navy);
  }
  .label{
    font-size:clamp(13px,3vw,18px);
    color:var(--ink);
    opacity:0.75;
    text-transform:uppercase;
    letter-spacing:0.1em;
    margin-top:-6px;
  }
  .bag-wrap{
    position:relative;
    height:clamp(200px, 42vh, 400px);
    aspect-ratio:240/320;
    margin:0 auto;
  }
  .bag-svg{
    width:100%;
    height:100%;
    display:block;
    overflow:visible;
  }
  #bagFillRect{
    transition:y 1.1s cubic-bezier(.22,.9,.2,1), height 1.1s cubic-bezier(.22,.9,.2,1);
  }
  .bag-label{
    position:absolute;
    left:19%;
    right:19%;
    top:33%;
    background:var(--cream);
    border:2px solid var(--ink);
    border-radius:10px;
    box-shadow:0 2px 6px rgba(0,0,0,0.15);
    padding:6% 5%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2%;
  }
  .bag-label .drop-icon{
    font-size:clamp(14px,4vw,20px);
    line-height:1;
  }
  .bag-label .quote{
    font-size:clamp(9.5px,2.6vw,13px);
    font-weight:800;
    color:var(--navy);
    line-height:1.25;
    letter-spacing:0.01em;
  }
  .bag-label .heart-row{
    font-size:clamp(11px,3vw,15px);
    color:var(--blood);
    line-height:1;
  }
  .pct{
    margin-top:2px;
    font-size:clamp(14px,3.4vw,20px);
    font-weight:700;
    color:var(--navy);
  }
  .goal-badge{
    display:none;
    background:var(--yellow);
    color:var(--navy);
    font-weight:700;
    padding:10px 5vw;
    border-radius:14px;
    font-size:clamp(12px,2.8vw,16px);
    line-height:1.3;
    letter-spacing:0.01em;
    box-shadow:0 2px 8px rgba(0,0,0,0.12);
    max-width:90%;
  }
  body.goal-reached .goal-badge{display:inline-block;}
  .bottom{
    flex:0 0 auto;
    padding-bottom:clamp(10px,3vh,24px);
    font-size:clamp(10px,2.4vw,13px);
    color:var(--ink);
    position:relative;
    z-index:2;
  }
  #updated{
    opacity:0.5;
  }
  @media (max-width:420px){
    .side-mascot{ height:clamp(70px,22vh,140px); opacity:0.8; }
  }
</style>
</head>
<body>
  <div class="logo-block">
    <img class="logo" src="assets/logo.jpg" alt="Resala AUC logo">
    <div class="logo-word">RESALA<br>AUC</div>
  </div>
  <img class="side-mascot" src="assets/character.png" alt="">

  <div class="top">
    <div class="mascot-ring">
      <img class="mascot-top" src="assets/character.png" alt="Blood drop mascot">
    </div>
    <h1>Blood Drive</h1>
    <div class="subtitle">Live Donation Tracker</div>
  </div>

  <div class="middle">
    <div class="goal-badge">We have completed our goal; however, many are still waiting.</div>

    <div class="count-row">
      <span class="count" id="count">0</span>
      <span class="of">/</span>
      <span class="target" id="target">200</span>
    </div>
    <div class="label">Donations so far</div>

    <div class="bag-wrap">
      <svg class="bag-svg" viewBox="0 0 240 320" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="bagClip">
            <rect x="20" y="50" width="200" height="250" rx="46" ry="46"/>
          </clipPath>
          <linearGradient id="bloodGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#d81e2c"/>
            <stop offset="100%" stop-color="#7d0d13"/>
          </linearGradient>
        </defs>

        <path d="M198,288 C214,300 218,314 209,326" stroke="#7d0d13" stroke-width="9" fill="none" stroke-linecap="round"/>
        <circle cx="208" cy="330" r="6" fill="#7d0d13"/>

        <rect x="99" y="14" width="14" height="46" rx="7" fill="none" stroke="#1b1f23" stroke-width="4"/>
        <rect x="127" y="14" width="14" height="46" rx="7" fill="none" stroke="#1b1f23" stroke-width="4"/>

        <rect x="20" y="50" width="200" height="250" rx="46" ry="46" fill="#fdf9f3" stroke="#1b1f23" stroke-width="5"/>

        <g clip-path="url(#bagClip)">
          <rect id="bagFillRect" x="20" y="300" width="200" height="0" fill="url(#bloodGradient)"/>
        </g>

        <rect x="20" y="50" width="200" height="250" rx="46" ry="46" fill="none" stroke="#1b1f23" stroke-width="5"/>
      </svg>

      <div class="bag-label">
        <div class="quote">ONE DONATION CAN SAVE THREE LIVES</div>
        <div class="heart-row">— ❤ —</div>
      </div>
    </div>
    <div class="pct" id="pct">0%</div>
  </div>

  <div class="bottom">
    <div id="updated">Last updated: —</div>
  </div>

  <script>
    const countEl = document.getElementById('count');
    const targetEl = document.getElementById('target');
    const bagFillRect = document.getElementById('bagFillRect');
    const pctEl = document.getElementById('pct');
    const updatedEl = document.getElementById('updated');

    const BAG_TOP = 50;
    const BAG_BOTTOM = 300;
    const BAG_MAX_HEIGHT = BAG_BOTTOM - BAG_TOP;

    let displayed = 0;

    function animateCount(to) {
      const start = displayed;
      const diff = to - start;
      if (diff === 0) return;
      const duration = 700;
      const startTime = performance.now();
      function step(now) {
        const t = Math.min(1, (now - startTime) / duration);
        const eased = 1 - Math.pow(1 - t, 3);
        const val = Math.round(start + diff * eased);
        countEl.textContent = val;
        if (t < 1) requestAnimationFrame(step);
        else displayed = to;
      }
      requestAnimationFrame(step);
    }

    async function refresh() {
      try {
        const res = await fetch('./data.json?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) return;
        const data = await res.json();
        const count = Math.max(0, Number(data.count) || 0);
        const target = Math.max(1, Number(data.target) || 200);
        const pct = Math.min(100, (count / target) * 100);

        targetEl.textContent = target;
        animateCount(count);

        const fillHeight = (pct / 100) * BAG_MAX_HEIGHT;
        bagFillRect.setAttribute('height', fillHeight);
        bagFillRect.setAttribute('y', BAG_BOTTOM - fillHeight);
        pctEl.textContent = Math.round(pct) + '%';

        document.body.classList.toggle('goal-reached', count >= target);

        if (count >= target) {
          setTimeout(() => { window.location.href = './celebration.html'; }, 1800);
          return;
        }

        if (data.updated) {
          const d = new Date(data.updated);
          if (!isNaN(d)) {
            updatedEl.textContent = 'Last updated: ' + d.toLocaleString();
          }
        }
      } catch (e) {
        // silent — keep showing last known value
      }
    }

    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
