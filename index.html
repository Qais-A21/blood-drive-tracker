<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c2c80">
<title>Blood Drive Live Tracker</title>
<style>
  :root{
    --navy:#0c2c80;
    --navy-deep:#081d57;
    --sky:#a7d4f2;
    --yellow:#ffee7d;
    --cream:#fdf9f3;
    --ink:#1b1f23;
    --blood:#b3121c;
    --blood-bright:#e0202e;
    --blood-dark:#7d0d13;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    min-height:100%;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  body{
    min-height:100vh;
    min-height:100dvh;
    background:
      radial-gradient(circle at 12% 8%, rgba(167,212,242,.75) 0, transparent 42%),
      radial-gradient(circle at 92% 92%, rgba(255,238,125,.45) 0, transparent 40%),
      var(--cream);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:max(env(safe-area-inset-top),14px) 5vw max(env(safe-area-inset-bottom),14px);
    text-align:center;
    overflow-x:hidden;
  }

  /* ---------- header ---------- */
  header{
    width:100%;
    max-width:720px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .logo{
    height:clamp(48px,12vw,72px);
    width:auto;
    border-radius:12px;
    background:#fff;
    padding:4px;
    box-shadow:0 2px 10px rgba(12,44,128,.15);
  }
  .logo-word{
    font-size:clamp(10px,2.4vw,13px);
    font-weight:800;
    color:var(--navy);
    line-height:1.25;
    letter-spacing:.1em;
    text-align:left;
  }
  .live{
    display:inline-flex;
    align-items:center;
    gap:7px;
    background:#fff;
    color:var(--navy);
    font-size:clamp(10px,2.4vw,12px);
    font-weight:800;
    letter-spacing:.12em;
    padding:7px 12px;
    border-radius:999px;
    box-shadow:0 2px 10px rgba(12,44,128,.12);
  }
  .live i{
    width:8px;height:8px;border-radius:50%;
    background:#1fb157;
    box-shadow:0 0 0 0 rgba(31,177,87,.6);
    animation:pulse 1.8s infinite;
  }
  .live.offline i{background:#b9bec6;animation:none;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(31,177,87,.55);}
    70%{box-shadow:0 0 0 9px rgba(31,177,87,0);}
    100%{box-shadow:0 0 0 0 rgba(31,177,87,0);}
  }

  .title{margin-top:clamp(10px,2.5vh,22px);}
  h1{
    font-size:clamp(28px,8vw,48px);
    color:var(--navy);
    font-weight:900;
    letter-spacing:-.01em;
    line-height:1.05;
  }
  h1 span{color:var(--blood);}
  .subtitle{
    margin-top:6px;
    font-size:clamp(11px,2.6vw,14px);
    opacity:.65;
    text-transform:uppercase;
    letter-spacing:.2em;
    font-weight:600;
  }

  /* ---------- main card ---------- */
  main{
    width:100%;
    max-width:560px;
    margin-top:clamp(12px,2.5vh,24px);
    background:rgba(255,255,255,.82);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border-radius:28px;
    box-shadow:0 10px 40px rgba(12,44,128,.14), 0 1px 0 rgba(255,255,255,.9) inset;
    padding:clamp(16px,3.5vh,30px) clamp(16px,5vw,32px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(10px,2vh,18px);
    position:relative;
  }
  .goal-badge{
    display:none;
    background:var(--yellow);
    color:var(--navy);
    font-weight:800;
    padding:10px 18px;
    border-radius:14px;
    font-size:clamp(12px,3vw,15px);
    line-height:1.35;
    box-shadow:0 3px 10px rgba(0,0,0,.12);
  }
  body.goal-reached .goal-badge{display:block;animation:pop .6s cubic-bezier(.2,1.4,.4,1);}
  @keyframes pop{from{transform:scale(.7);opacity:0;}to{transform:scale(1);opacity:1;}}

  .count-row{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:clamp(6px,1.6vw,12px);
  }
  .count{
    font-size:clamp(64px,20vw,120px);
    font-weight:900;
    line-height:.95;
    font-variant-numeric:tabular-nums;
    background:linear-gradient(180deg,var(--blood-bright),var(--blood-dark));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:var(--blood);
  }
  .of{
    font-size:clamp(22px,6vw,38px);
    font-weight:600;
    color:var(--navy);
    opacity:.35;
  }
  .target{
    font-size:clamp(28px,8vw,48px);
    font-weight:800;
    color:var(--navy);
  }
  .label{
    font-size:clamp(11px,2.8vw,14px);
    opacity:.65;
    text-transform:uppercase;
    letter-spacing:.2em;
    font-weight:700;
    margin-top:-6px;
  }

  /* ---------- blood bag ---------- */
  .bag-wrap{
    position:relative;
    height:clamp(190px,36vh,360px);
    aspect-ratio:240/320;
    margin:0 auto;
    filter:drop-shadow(0 10px 14px rgba(125,13,19,.18));
  }
  .bag-svg{width:100%;height:100%;display:block;overflow:visible;}
  #bagFill{transition:transform 1.4s cubic-bezier(.22,.9,.2,1);}
  .wave{animation:wave 4s linear infinite;}
  .wave.back{animation-duration:6s;animation-direction:reverse;opacity:.55;}
  @keyframes wave{from{transform:translateX(0);}to{transform:translateX(-120px);}}
  .bag-label{
    position:absolute;
    left:17%;right:17%;
    top:33%;
    background:rgba(253,249,243,.95);
    border:2px solid var(--ink);
    border-radius:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
    padding:7% 5%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .bag-label .drop-icon{font-size:clamp(16px,4vw,22px);line-height:1;}
  .bag-label .quote{
    font-size:clamp(9px,2.4vw,12.5px);
    font-weight:800;
    color:var(--navy);
    line-height:1.25;
  }
  .bag-label .heart-row{font-size:clamp(11px,3vw,15px);color:var(--blood);line-height:1;}

  /* ---------- progress ---------- */
  .progress{width:100%;}
  .pct{
    font-size:clamp(20px,5vw,28px);
    font-weight:900;
    color:var(--navy);
    margin-bottom:8px;
  }
  .bar{
    position:relative;
    height:16px;
    border-radius:999px;
    background:#e6ecf5;
    overflow:hidden;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.12);
  }
  .bar-fill{
    height:100%;
    width:0;
    border-radius:999px;
    background:linear-gradient(90deg,var(--blood-dark),var(--blood-bright));
    transition:width 1.4s cubic-bezier(.22,.9,.2,1);
    position:relative;
    overflow:hidden;
  }
  .bar-fill::after{
    content:"";
    position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
    transform:translateX(-100%);
    animation:shine 2.8s ease-in-out infinite;
  }
  @keyframes shine{to{transform:translateX(100%);}}
  .ticks{
    display:flex;
    justify-content:space-between;
    margin-top:8px;
    font-size:clamp(10px,2.4vw,12px);
    font-weight:700;
    color:var(--navy);
    opacity:.55;
  }
  .remaining{
    margin-top:10px;
    font-size:clamp(12px,3vw,15px);
    font-weight:600;
    color:var(--ink);
    opacity:.75;
  }
  .remaining b{color:var(--blood);}

  footer{
    margin-top:auto;
    padding-top:clamp(12px,2.5vh,22px);
    font-size:clamp(10px,2.4vw,12px);
    opacity:.55;
  }

  @media (max-height:700px){
    .bag-wrap{height:clamp(150px,30vh,260px);}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <img class="logo" src="assets/logo.jpg" alt="Resala AUC logo">
      <div class="logo-word">RESALA<br>AUC</div>
    </div>
    <div class="live" id="live"><i></i>LIVE</div>
  </header>

  <div class="title">
    <h1>Blood <span>Drive</span></h1>
    <div class="subtitle">Live Donation Tracker</div>
  </div>

  <main>
    <div class="goal-badge">We have completed our goal; however, many are still waiting.</div>

    <div>
      <div class="count-row">
        <span class="count" id="count">0</span>
        <span class="of">/</span>
        <span class="target" id="target">200</span>
      </div>
      <div class="label">Donations so far</div>
    </div>

    <div class="bag-wrap">
      <svg class="bag-svg" viewBox="0 0 240 320" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="bagClip">
            <rect x="20" y="50" width="200" height="250" rx="46" ry="46"/>
          </clipPath>
          <linearGradient id="bloodGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#e0202e"/>
            <stop offset="100%" stop-color="#7d0d13"/>
          </linearGradient>
        </defs>

        <path d="M198,288 C214,300 218,314 209,326" stroke="#7d0d13" stroke-width="9" fill="none" stroke-linecap="round"/>
        <circle cx="208" cy="330" r="6" fill="#7d0d13"/>

        <rect x="99" y="14" width="14" height="46" rx="7" fill="none" stroke="#1b1f23" stroke-width="4"/>
        <rect x="127" y="14" width="14" height="46" rx="7" fill="none" stroke="#1b1f23" stroke-width="4"/>

        <rect x="20" y="50" width="200" height="250" rx="46" ry="46" fill="#fdf9f3"/>

        <g clip-path="url(#bagClip)">
          <!-- translateY moves the whole blood body: 0 = full, 260 = empty -->
          <g id="bagFill" style="transform:translateY(260px)">
            <path class="wave back" fill="#b3121c"
              d="M0,0 q30,-10 60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 V270 H0 Z" transform="translate(-20,46)"/>
            <path class="wave" fill="url(#bloodGradient)"
              d="M0,0 q30,10 60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 V270 H0 Z" transform="translate(-20,50)"/>
          </g>
        </g>

        <rect x="20" y="50" width="200" height="250" rx="46" ry="46" fill="none" stroke="#1b1f23" stroke-width="5"/>
      </svg>

      <div class="bag-label">
        <div class="drop-icon">🩸</div>
        <div class="quote">ONE DONATION CAN SAVE THREE LIVES</div>
        <div class="heart-row">— ❤ —</div>
      </div>
    </div>

    <div class="progress">
      <div class="pct" id="pct">0%</div>
      <div class="bar"><div class="bar-fill" id="barFill"></div></div>
      <div class="ticks"><span>0</span><span id="t25"></span><span id="t50"></span><span id="t75"></span><span id="t100"></span></div>
      <div class="remaining" id="remaining"></div>
    </div>
  </main>

  <footer id="updated">Last updated: —</footer>

  <script>
    const $ = id => document.getElementById(id);
    const countEl = $('count'), targetEl = $('target'), pctEl = $('pct');
    const bagFill = $('bagFill'), barFill = $('barFill');
    const updatedEl = $('updated'), liveEl = $('live'), remainingEl = $('remaining');

    // Blood body spans y=50 (full) .. y=300 (empty) => 250 units, plus wave amplitude
    const BAG_HEIGHT = 250;
    let displayed = 0;

    function animateCount(to) {
      const start = displayed;
      const diff = to - start;
      if (diff === 0) return;
      displayed = to;
      const duration = 900;
      const t0 = performance.now();
      (function step(now) {
        const t = Math.min(1, (now - t0) / duration);
        const eased = 1 - Math.pow(1 - t, 3);
        countEl.textContent = Math.round(start + diff * eased);
        if (t < 1) requestAnimationFrame(step);
      })(t0);
    }

    function formatUpdated(v) {
      if (!v) return '';
      const d = new Date(v);
      return isNaN(d) ? String(v) : d.toLocaleString();
    }

    async function refresh() {
      try {
        const res = await fetch('./data.json?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        const count = Math.max(0, Number(data.count) || 0);
        const target = Math.max(1, Number(data.target) || 200);
        const pct = Math.min(100, (count / target) * 100);

        targetEl.textContent = target;
        animateCount(count);

        bagFill.style.transform = 'translateY(' + (BAG_HEIGHT * (1 - pct / 100)) + 'px)';
        barFill.style.width = pct + '%';
        pctEl.textContent = Math.round(pct) + '%';

        [25, 50, 75, 100].forEach(p => { $('t' + p).textContent = Math.round(target * p / 100); });
        remainingEl.innerHTML = count >= target
          ? 'Goal reached — thank you, donors! ❤'
          : '<b>' + (target - count) + '</b> more donation' + (target - count === 1 ? '' : 's') + ' to reach our goal';

        document.body.classList.toggle('goal-reached', count >= target);

        const u = formatUpdated(data.updated);
        if (u) updatedEl.textContent = 'Last updated: ' + u;
        liveEl.classList.remove('offline');
      } catch (e) {
        liveEl.classList.add('offline');   // keep showing last known value
      }
    }

    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
